# Blog do Leonardo Calvet — blog.calvet.dev.br
# Tema: Hitchens (https://github.com/patdryburgh/hitchens) — MIT, ver LICENSE.txt
# Paleta: Flexoki (https://stephango.com/flexoki) aplicada em _sass/_variables.scss

title: Leonardo Calvet
email: ola@calvet.dev.br
description: >-
  Ruby, home servers e o que mais eu estiver aprendendo.
url: "https://blog.calvet.dev.br"
lang: pt-BR
timezone: "America/Sao_Paulo"

# menu do masthead (_data/menu.yml)

twitter_username:
github_username: LeoCalvet

markdown: kramdown
permalink: /:year/:month/:day/:slug/
kramdown:
  input: GFM

paginate: 5
paginate_path: "/page/:num/"

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - hitchens-theme.gemspec
  - README.md
  - AGENTS.md
  - compose.yaml
  - nginx
  - site
  - _drafts
  - LICENSE.txt

plugins:
  - jekyll-paginate

# admonition para agentes: NÃO adicionar tema gem-based aqui; este repo
# carrega o tema por cópia (layouts/sass no repo), como o Hitchens pede.

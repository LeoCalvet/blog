###########################################################
### Blog do Leonardo Calvet — blog.calvet.dev.br
### Baseado no Beautiful Jekyll (https://beautifuljekyll.com)
### Paleta de cores: Flexoki (https://stephango.com/flexoki)
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Leonardo Calvet

# Your name to show in the footer
author: Leonardo Calvet

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Sobre: "sobre"
  Tags: "tags"

################
# --- Logo --- #
################

# Image to show in the navigation bar - works best with a square image
# Remove this parameter if you don't want an image in the navbar
#avatar: "/assets/img/avatar-icon.png"
round-avatar: true

# If you want to have an image logo in the top-left corner instead of having the title of the website,
# then specify the following parameter
#title-img: /path/to/image


#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  rss: true
  github: LeoCalvet

# If you want your website to generate an RSS feed, provide a description
# The URL for the feed will be https://<your_website>/feed.xml
rss-description: Blog do Leonardo Calvet — Ruby, home servers e projetos pessoais

###########################
# --- General options --- #
###########################

# Select which social network share links to show in posts
share-links-active:
  twitter: false
  facebook: false
  linkedin: true
  vk: false
  reddit: false

# How to display the link to your website in the footer
url-pretty: "blog.calvet.dev.br"

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt word length - Truncate the excerpt of each post on the feed page to the specified number of words
excerpt_length: 50

# Whether or not to show an excerpt for every blog post in the feed page
feed_show_excerpt: true

# Whether or not to show a list of tags below each post preview in the feed page
feed_show_tags: true

# Add a search button to the navbar
post_search: true

# Add a button in the footer to edit the current page. Only works if your website is hosted on GitHub
edit_page_button: true

# Allow sub-menu items (second-level navigation menu items) to be longer than the top-level menu
navbar-var-length: false

# The keywords to associate with your website, for SEO purposes
keywords: "leonardo calvet, ruby, jekyll, home server, docker"

######################################
# --- Colours — paleta Flexoki --- #
######################################
# Flexoki light (https://stephango.com/flexoki)
# fundo papel #FFFCF0, superfície #F2F0E5, texto #100F0F, muted #878580
# acentos (tom "dark" p/ fundo claro): blue #205EA6, cyan #24837B

page-col: "#FFFCF0"
text-col: "#100F0F"
link-col: "#205EA6"
hover-col: "#24837B"
navbar-col: "#F2F0E5"
navbar-text-col: "#100F0F"
navbar-border-col: "#DEDEDB"
footer-col: "#F2F0E5"
footer-text-col: "#6F6E69"
footer-link-col: "#100F0F"
footer-hover-col: "#24837B"

# For any extra visual customization, you can include additional CSS files in every page on your site.
site-css:
  - "/assets/css/flexoki.css"

#################################
# --- Web Analytics Section --- #
#################################

# Fill in your Google Analytics tag ID (or "Measurement ID") to track your website usage
#gtag: "G-XXXXXXXXXX"

####################
# --- Comments --- #
####################

# Comentários desativados por enquanto (opções: giscus, utterances, disqus — ver _config original do tema)

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%d/%m/%Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "America/Sao_Paulo"
lang: pt-BR
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:slug/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - compose.yaml
  - screenshot.png
  - beautiful-jekyll-theme.gemspec
  - site

plugins:
  - jekyll-paginate
  - jekyll-sitemap

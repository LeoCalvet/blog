server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # redirects relativos: preserva o host:porta que o navegador usou
    # (sem isso, /sobre -> Location: http://localhost/sobre/ na porta 80)
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
